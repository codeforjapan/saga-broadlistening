name: Deploy Topic Analysis Worker (ECR)

# worker / topic-analysis-core / その依存パッケージがmainに変わったときだけ
# イメージをビルドしてECRにpushする（#48 / #66）。Batch Job Definitionは常に:latestタグを
# 参照するため、pushするだけで次回のSubmitJobから新しいイメージが使われる。
#
# 現状はprd環境のみ対象。dev環境（developブランチ）への自動pushは未対応。
# infra/aws-cdk/README.mdの手順で手動push、またはdev用の同様のjobを追加すること。
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "packages/topic-analysis-core/**"
      - "packages/shared/**"
      - "packages/supabase/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy_worker_ecs.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-worker-ecs-prd
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_ROLE_ARN: ${{ secrets.AWS_CDK_PRD_DEPLOY_ROLE_ARN }}
      ECR_REPOSITORY: mirai-gikai-topic-analysis-worker-prd
      AWS_REGION: ap-northeast-1
    steps:
      # AWS側の設定（infra/aws-cdk/README.md参照）が未完了でも赤にせず、green skipにする。
      - name: Check AWS configuration
        id: cfg
        run: |
          if [ -z "$DEPLOY_ROLE_ARN" ]; then
            echo "AWS_CDK_PRD_DEPLOY_ROLE_ARN secret is not set — skipping ECR push (see infra/aws-cdk/README.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.configured == 'true'

      - name: Configure AWS credentials
        if: steps.cfg.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.cfg.outputs.configured == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push image
        if: steps.cfg.outputs.configured == 'true'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_BASE="${REGISTRY}/${ECR_REPOSITORY}"
          docker build --platform linux/amd64 -f worker/Dockerfile \
            -t "${IMAGE_BASE}:${GITHUB_SHA}" \
            -t "${IMAGE_BASE}:latest" \
            .
          docker push "${IMAGE_BASE}:${GITHUB_SHA}"
          docker push "${IMAGE_BASE}:latest"
