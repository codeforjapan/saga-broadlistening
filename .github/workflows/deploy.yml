name: Migrate DB then Deploy

on:
  push:
    branches: [ main, develop ]

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    # secret は job レベルにまとめて env へ写す（supabase_preview.yml と同じ方式）。
    # step ごとに再宣言すると、下の Check required secrets に足し忘れて検査が素通りする。
    # secret を増やすときは、下の Check required secrets の一覧と
    # docs/20260831_1030_deploy用GitHubシークレット設定手順.md の表にも足すこと。
    env:
      # environment: キーは env コンテキストを参照できないため、名前だけ再掲する
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
      ADMIN_AUTH_CALLBACK_URL: ${{ secrets.ADMIN_AUTH_CALLBACK_URL }}
      WEB_VERCEL_DEPLOY_HOOK_URL: ${{ secrets.WEB_VERCEL_DEPLOY_HOOK_URL }}
      ADMIN_VERCEL_DEPLOY_HOOK_URL: ${{ secrets.ADMIN_VERCEL_DEPLOY_HOOK_URL }}
    steps:
      # Environment に secret が無いまま実行すると、supabase link が
      # 「Missing value for flag --project-ref」という usage を吐いて exit 1 するだけで
      # 原因が分からない（run 33347168191 / staging environment が空だった）。
      # db push の前に落とすことで、マイグレーションだけ適用されて Vercel デプロイが
      # 飛ばない中途半端な状態も防ぐ。
      #
      # deploy_worker.yml と supabase_preview.yml は「未設定 = 正常な状態」として
      # green でスキップするが、こちらはデプロイ本体なので必ず fail させること。
      # skip にすると「成功したのに何もデプロイしていない」状態になり、staging DB が
      # supabase/migrations から静かに乖離する。
      - name: Check required secrets
        run: |
          missing=()
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD \
                     SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET \
                     ADMIN_AUTH_CALLBACK_URL WEB_VERCEL_DEPLOY_HOOK_URL ADMIN_VERCEL_DEPLOY_HOOK_URL; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::environment '${DEPLOY_ENV}' に次の secret が未設定です: ${missing[*]} — https://github.com/${GITHUB_REPOSITORY}/settings/environments で設定してください（取得元は docs/20260831_1030_deploy用GitHubシークレット設定手順.md を参照）"
            exit 1
          fi

      - uses: actions/checkout@v5

      # Supabase CLI セットアップ
      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
            version: latest

      # Supabase プロジェクトへリンク（ノンインタラクティブ）
      - name: Supabase link
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # マイグレーション適用（idempotent）
      # --yes: CI(非TTY)で確認プロンプト待ちハングを防ぐ（prod に未適用マイグレーションが
      # あると supabase db push が [Y/n] を出して stdin 待ちで停止するため。実際に本番デプロイが
      # db push で数時間ハングした）
      - name: Supabase db push
        run: |
          supabase db push --include-all --yes
          supabase config push --yes

      # 成功したら Vercel デプロイを開始
      # 一過性の失敗でジョブ全体を再実行しないようリトライする。片方が落ちても
      # もう片方は叩く（web だけデプロイされて admin が取り残される状態を避ける）
      - name: Trigger Vercel Deploy Hook
        run: |
          # URL 自体が secret でログに出せないため、失敗時はどちらの hook かを名前で示す
          status=0
          for target in WEB ADMIN; do
            url_var="${target}_VERCEL_DEPLOY_HOOK_URL"
            curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
              -X POST "${!url_var}" -o /dev/null \
              || { echo "::error::${target} の Vercel deploy hook 呼び出しに失敗しました"; status=1; }
          done
          exit $status
