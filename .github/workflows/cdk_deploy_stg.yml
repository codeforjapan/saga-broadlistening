name: CDK Deploy [stg]

# develop へのマージ（push）で infra/aws-cdk に変更があるとき、stg環境へ cdk deploy する。
# develop環境（staging）はAWSアカウントをstg環境（826784631888）と共用しているため、
# 独立したstg環境は作らず、既存のstgスタックにそのままデプロイする。
on:
  push:
    branches: [develop]
    paths:
      - "infra/aws-cdk/**"
      - ".github/workflows/cdk_deploy_stg.yml"
      - ".github/workflows/_cdk_deploy.yml"

concurrency:
  group: cdk-deploy-stg
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  cdk-deploy:
    uses: ./.github/workflows/_cdk_deploy.yml
    with:
      environment: staging
      context_env: stg
    secrets:
      role_arn: ${{ secrets.AWS_CDK_DEPLOY_ROLE_ARN }}
