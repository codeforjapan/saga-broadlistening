name: TMP Verify Shared Deploy Role Secret

# 一時的な検証用ワークフロー。AWS_CDK_DEPLOY_ROLE_ARN（production/staging両Environmentに
# 同名で登録した共有Secret）がOIDC経由で正しく解決・AssumeRoleできるかを
# 読み取り専用のsts:GetCallerIdentityだけで確認する。検証後に削除する。
on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub Environment name to verify (production or staging)"
        required: true
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_CDK_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Show caller identity
        run: aws sts get-caller-identity
