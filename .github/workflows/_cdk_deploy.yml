name: Reusable CDK Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "GitHub Environment name (e.g. production, development)"
      context_env:
        required: true
        type: string
        description: "CDK context environment name (e.g. prd, dev, stg)"
    secrets:
      role_arn:
        required: false
        description: "AWS IAM Role ARN to assume via OIDC"

permissions:
  contents: read
  id-token: write

jobs:
  cdk-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ROLE_ARN: ${{ secrets.role_arn }}
    steps:
      # Environment の Secret は job 開始後のステップでしか参照できない。
      # AWS側の設定（README参照）が未完了でも赤にせず、green skip にする。
      - name: Check AWS configuration
        id: cfg
        run: |
          if [ -z "$DEPLOY_ROLE_ARN" ]; then
            echo "Role ARN secret is not set — skipping cdk deploy for ${{ inputs.context_env }} (see infra/aws-cdk/README.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v5

      - name: Install pnpm
        if: steps.cfg.outputs.configured == 'true'
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.cfg.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        if: steps.cfg.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Run cdk deploy
        if: steps.cfg.outputs.configured == 'true'
        working-directory: infra/aws-cdk
        run: pnpm exec cdk deploy --all --context env=${{ inputs.context_env }} --require-approval never
